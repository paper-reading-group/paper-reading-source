# Scheme 风格
scheme: Pisces

# 暗色模式
darkmode: true

# 菜单导航
menu:
  Home: / || fa fa-home
  Papers: /papers/ || fa fa-file-alt
  Topics: /categories/ || fa fa-layer-group
  Tags: /tags/ || fa fa-tags
  About: /about/ || fa fa-info-circle

# 侧边栏
sidebar:
  position: left
  display: post

# 页面动画
motion:
  enable: true
  async: false
  transition:
    post_block: fadeIn
    post_header: fadeInDown
    post_body: fadeInDown
    coll_header: fadeInLeft
    sidebar: fadeInUp

# 封面图
cover:
  enable: true
  sidebar: true

# 图片缩放
mediumzoom: true

# 图片懒加载
lazyload: true

# Pangu中文优化
pangu: true

# toc目录
toc:
  enable: true
  number: true
  wrap: false

# 头像
avatar:
  url: /images/avatar.gif
  rounded: true

# 数学公式
mathjax:
  enable: true
  per_page: true

# 本地搜索
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 3

# 代码块（使用肯定存在的 default 样式，绝不出错）
codeblock:
  theme:
    light: atom-one-light
    dark: atom-one-dark
  copy_button:
    enable: true
    
# 文章摘要
excerpt_description: false

# 阅读进度条
reading_progress:
  enable: true

# 书签
bookmark:
  enable: true

# 返回顶部按钮
back2top:
  enable: true
  sidebar: true
  scrollpercent: true

# 版权声明
creative_commons:
  license: by-nc-sa
  sidebar: true
  post: true
  language: deed.en

# 评论暂不启用，避免干扰
# gitalk:
#   enable: false

# 自定义样式
custom_file_path:
  style: source/_data/styles.styl
