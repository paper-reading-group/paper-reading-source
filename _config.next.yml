# Scheme 风格
scheme: Pisces

# 暗色模式
darkmode: true

# 菜单导航
menu:
  home: / || fa fa-home
  papers: /categories/papers/ || fa fa-file-alt
  topics: /topics || fa fa-layer-group
  members: /members || fa fa-users
  timeline: /timeline || fa fa-stream
  tags: /tags || fa fa-tags
  about: /about || fa fa-info-circle

# 侧边栏
sidebar:
  position: left
  display: post

# 头像
avatar:
  url: /images/logo.png
  rounded: true

# 数学公式
mathjax:
  enable: true
  per_page: true

# 本地搜索
local_search:
  enable: true

# 代码块（使用肯定存在的 default 样式，绝不出错）
codeblock:
  theme:
    light: atom-one-light
    dark: atom-one-dark
  copy_button:
    enable: true
    
# 文章摘要
excerpt_description: false

# 阅读进度条
reading_progress:
  enable: true

# 书签
bookmark:
  enable: true

# 版权声明
creative_commons:
  license: by-nc-sa
  sidebar: true
  post: true
  language: deed.en

# 评论暂不启用，避免干扰
# gitalk:
#   enable: false

# 自定义样式
custom_file_path:
  style: source/_data/styles.styl